name: AURA Integra — CI / CD Release Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_SUPABASE_URL: https://ci-test-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-service-key
  NODE_ENV: test
  CI: '1'

jobs:
  lint-and-types:
    name: 1. Code Quality (Lint & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Migration Drift Check
        run: node scripts/check-migrations.mjs

  test-engine:
    name: 2. Test Engine Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite (Unit, Scenarios, API, Security, Integrity, Perf)
        run: npm test

      - name: Run Dedicated API Suite
        run: npm run test:api

      - name: Run Dedicated Security Suite
        run: npm run test:security

      - name: Run Dedicated Database Integrity Suite
        run: npm run test:integrity

      - name: Run Dedicated Performance Suite
        run: npm run test:performance

  build-gate:
    name: 3. Next.js Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-types, test-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build

  e2e-matrix:
    name: 4. Critical E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [build-gate]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, 'Mobile Chrome']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Project
        run: npx playwright test --project="${{ matrix.project }}"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  release-gate-summary:
    name: 5. Release Gate Summary
    runs-on: ubuntu-latest
    needs: [lint-and-types, test-engine, build-gate, e2e-matrix]
    if: always()
    steps:
      - name: Evaluate Release Gate Status
        run: |
          if [ "${{ needs.lint-and-types.result }}" = "success" ] && \
             [ "${{ needs.test-engine.result }}" = "success" ] && \
             [ "${{ needs.build-gate.result }}" = "success" ] && \
             [ "${{ needs.e2e-matrix.result }}" = "success" ]; then
            echo "### 🚀 AURA İntegra CI/CD Release Gate: PASS" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 1. Lint & Code Quality | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| 2. Test Engine (511 Tests) | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| 3. Production Build | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| 4. E2E (Desktop & Mobile) | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Sonuç:** Güvenle Merge Edilebilir (Release Ready)." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### 🛑 AURA İntegra CI/CD Release Gate: BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "En az bir kalite kontrol adımı başarısız oldu. Merge engellendi." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
