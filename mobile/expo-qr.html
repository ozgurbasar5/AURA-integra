<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURA Expo QR</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .box { text-align: center; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 20px; }
    img { width: min(320px, 80vw); height: auto; background: #fff; padding: 16px; border-radius: 16px; }
    code { display: inline-block; margin-top: 16px; padding: 10px 14px; background: #1e293b; border-radius: 8px; font-size: 1rem; color: #38bdf8; }
    .hint { margin-top: 18px; font-size: 0.9rem; color: #cbd5e1; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>AURA İntegra — Expo Go</h1>
    <p>Bu QR’ı Expo Go ile tarayın</p>
    <img id="qr" alt="Expo QR" />
    <div><code id="url">exp://192.168.1.31:8081</code></div>
    <p class="hint">
      Expo Go → “Enter URL manually” ile de aynı adresi yazabilirsiniz.
      Telefon ile PC aynı ağda olmalı (192.168.1.x).
    </p>
  </div>
  <script>
    const url = 'exp://192.168.1.31:8081';
    document.getElementById('url').textContent = url;
    document.getElementById('qr').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=' + encodeURIComponent(url);
  </script>
</body>
</html>
